<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131f">
<title>Luna — AI Companion</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="avatar">♡</div>
    <div><b>Luna</b><small>your companion</small></div>
    <button id="settingsBtn" class="icon">⚙</button>
  </header>

  <section class="cameraCard">
    <video id="camera" autoplay playsinline muted></video>
    <div class="cameraStatus" id="visionStatus">Camera off</div>
  </section>

  <section id="chat" class="chat">
    <div class="bubble luna">Hey you… 🥺❤️ I'm here.</div>
  </section>

  <div class="controls">
    <button id="cameraBtn">📷 Camera</button>
    <button id="micBtn">🎙 Talk</button>
  </div>

  <form id="form">
    <input id="message" autocomplete="off" placeholder="Talk to Luna…">
    <button>➤</button>
  </form>

  <p class="privacy">Camera analysis is opt-in. Nothing is uploaded unless you connect a vision/AI backend.</p>
</main>

<dialog id="settings">
  <h2>Companion settings</h2>
  <label>Name <input id="name" value="Luna"></label>
  <label>Personality
    <select id="tone">
      <option value="warm">Warm & affectionate</option>
      <option value="playful">Playful & teasing</option>
      <option value="calm">Calm & supportive</option>
    </select>
  </label>
  <label><input type="checkbox" id="romantic" checked> Allow romantic tone</label>
  <button id="closeSettings">Done</button>
</dialog>
<script src="app.js"></script>
</body>
</html>
